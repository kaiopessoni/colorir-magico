<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f43f5e">
<title>Colorir Mágico - Cantinho da Arte Infantil</title>
</head>
<body>

<!-- ==========================================================================
     COLORIR MÁGICO — bloco 100% autocontido.
     Tudo (CSS + HTML + JS) vive dentro de #colorir-app / classes .cm-*,
     para que este arquivo possa ser injetado dentro de qualquer página
     hospedada sem vazar estilo nenhum para fora.
     ========================================================================== -->

<style data-cm="estilos">
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');

/* Página cheia, sem rolagem. (Ao injetar em outro site, esta única regra
   html/body é a que pode ser removida — todo o resto já é escopado.) */
html, body { height:100%; margin:0; padding:0; overflow:hidden; }

#colorir-app, #colorir-app *, #colorir-app *::before, #colorir-app *::after { box-sizing: border-box; margin: 0; padding: 0; }

#colorir-app {
  --cm-red-1:#f87171; --cm-red-2:#ef4444; --cm-red-3:#dc2626;
  --cm-yellow-1:#fcd34d; --cm-yellow-2:#facc15; --cm-yellow-3:#f59e0b;
  --cm-ink:#1e293b; --cm-paper:#ffffff;
  --cm-radius:26px;
  font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  font-size:16px; line-height:1.25; color:var(--cm-ink);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
  background:linear-gradient(180deg,#dbeafe 0%,#fef3c7 55%,#ffedd5 100%);
  width:100%; height:100vh; height:100svh; overflow:hidden;
  display:flex; flex-direction:column; gap:10px;
  padding:12px; overscroll-behavior:none;
}
/* conteúdo centralizado, limitado a 1300px; abaixo disso ocupa a tela toda */
#colorir-app > header, #colorir-app > main, #colorir-app > footer {
  width:100%; max-width:1300px; margin-inline:auto;
}
#colorir-app button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
#colorir-app svg { display:block; }

/* ---------- botão de brinquedo (3D tátil) ---------- */
#colorir-app .cm-toy {
  position:relative; border-radius:20px;
  box-shadow:0 5px 0 rgba(0,0,0,.2);
  transition:transform .1s cubic-bezier(.4,0,.2,1), box-shadow .1s cubic-bezier(.4,0,.2,1), background-color .15s;
}
#colorir-app .cm-toy:hover { transform:translateY(-2px); box-shadow:0 7px 0 rgba(0,0,0,.2); }
#colorir-app .cm-toy:active { transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.2); }
#colorir-app .cm-toy.is-on { transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.22); }

/* ---------- barra superior ---------- */
#colorir-app .cm-topbar {
  flex:0 0 auto;
  background:linear-gradient(100deg,var(--cm-red-1),var(--cm-red-2) 45%,var(--cm-red-3));
  border:4px solid #fca5a5; border-radius:var(--cm-radius);
  box-shadow:0 10px 24px rgba(220,38,38,.28);
  padding:10px 12px;
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px;
}
#colorir-app .cm-brand { display:flex; align-items:center; gap:8px; color:#fff; padding-inline:4px; }
#colorir-app .cm-brand-emoji { font-size:34px; line-height:1; animation:cm-bounce 1.8s ease-in-out infinite; }
@keyframes cm-bounce { 0%,100%{transform:translateY(0) rotate(-6deg)} 50%{transform:translateY(-6px) rotate(6deg)} }
#colorir-app .cm-brand h1 { font-size:22px; font-weight:700; letter-spacing:.4px; text-shadow:0 2px 0 rgba(0,0,0,.18); }
#colorir-app .cm-brand p { font-size:11.5px; font-weight:500; color:#ffe4e6; }

#colorir-app .cm-group { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; }
#colorir-app .cm-pod { display:flex; align-items:center; gap:6px; padding:5px; border-radius:24px;
  background:rgba(127,29,29,.42); border:2px solid rgba(254,202,202,.45); }

/* ícones grandes = leitura por imagem (criança que ainda não lê) */
#colorir-app .cm-tool {
  width:60px; height:60px; display:grid; place-items:center;
  background:#fff; border:3px solid #fff; border-radius:20px; color:#be123c;
}
#colorir-app .cm-tool svg { width:34px; height:34px; }
#colorir-app .cm-tool.is-on {
  background:linear-gradient(180deg,#fde68a,var(--cm-yellow-2));
  border-color:#fff; color:#78350f;
  box-shadow:0 2px 0 rgba(0,0,0,.22), 0 0 0 4px rgba(255,255,255,.85), 0 0 26px rgba(250,204,21,.9);
}
#colorir-app .cm-tool.is-on::after {
  content:''; position:absolute; inset:auto 0 -13px 0; margin:auto; width:12px; height:12px;
  border-radius:50%; background:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.5);
}
#colorir-app .cm-size {
  width:48px; height:48px; border-radius:16px; background:#fff; display:grid; place-items:center;
  border:3px solid #fff;
}
#colorir-app .cm-size i { display:block; border-radius:50%; background:var(--cm-ink); }
#colorir-app .cm-size.is-on { background:linear-gradient(180deg,#fde68a,var(--cm-yellow-2));
  box-shadow:0 2px 0 rgba(0,0,0,.22), 0 0 0 4px rgba(255,255,255,.85); }
#colorir-app .cm-size.is-on i { background:#78350f; }

#colorir-app .cm-action { width:60px; height:60px; display:grid; place-items:center; border-radius:20px;
  border:3px solid #fff; background:#fff; color:#334155; }
#colorir-app .cm-action svg { width:32px; height:32px; }
#colorir-app .cm-action.cm-save { background:linear-gradient(180deg,#34d399,#059669); color:#fff; border-color:#a7f3d0; }
/* só aparecem no celular */
#colorir-app .cm-color-btn { display:none; }
#colorir-app .cm-color-btn {
  width:52px; height:52px; place-items:center; border-radius:17px;
  background:#fff; border:3px solid #fff;
}
#colorir-app .cm-color-btn-chip {
  width:30px; height:30px; border-radius:50%; background:#ef4444;
  border:3px solid #fff; box-shadow:0 0 0 2px rgba(15,23,42,.25), inset 0 2px 4px rgba(0,0,0,.25);
}
#colorir-app .cm-color-box { width:min(400px,100%); }
#colorir-app .cm-color-grid {
  display:grid; grid-template-columns:repeat(4,1fr); gap:14px 12px; width:100%; padding:6px 4px;
  place-items:center;
}
#colorir-app .cm-color-grid .cm-swatch { width:100%; max-width:62px; height:auto; max-height:none; aspect-ratio:1/1; }
#colorir-app .cm-clear-in-modal { background:#0f172a; color:#fff; }
#colorir-app .cm-clear-in-modal svg { width:20px; height:20px; }
#colorir-app .cm-action.cm-print { background:linear-gradient(180deg,#60a5fa,#2563eb); color:#fff; border-color:#bfdbfe; }
#colorir-app .cm-action[disabled] { opacity:.45; cursor:default; transform:none !important; }

/* ---------- área de trabalho ---------- */
#colorir-app .cm-work { flex:1 1 auto; display:flex; gap:10px; align-items:stretch; min-height:0; }
#colorir-app .cm-stage {
  position:relative; flex:1 1 auto; min-width:0; min-height:0;
  background:#fff; border:4px solid #fde68a; border-radius:var(--cm-radius);
  box-shadow:0 10px 24px rgba(180,83,9,.18); overflow:hidden;
}
#colorir-app .cm-stage::before {
  content:''; position:absolute; inset:0; pointer-events:none; opacity:.05;
  background-image:radial-gradient(#000 1px,transparent 1px); background-size:16px 16px;
}
#colorir-app .cm-paper {
  position:absolute; inset:0; width:100%; height:100%;
  background:#fff; border-radius:18px;
  overflow:hidden; touch-action:none; cursor:crosshair;
}
#colorir-app .cm-paper canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
#colorir-app .cm-paper canvas.cm-lines { pointer-events:none; }
#colorir-app .cm-ghost {
  position:absolute; border-radius:50%; pointer-events:none; opacity:0;
  transform:translate(-50%,-50%); border:2px solid rgba(15,23,42,.55);
  transition:opacity .12s; z-index:5;
}

/* ---------- paleta lateral ---------- */
#colorir-app .cm-palette {
  width:140px; flex:0 0 auto; display:flex; flex-direction:column; gap:10px; align-items:center;
  background:linear-gradient(180deg,var(--cm-yellow-1),var(--cm-yellow-2) 55%,var(--cm-yellow-3));
  border:4px solid #fef08a; border-radius:var(--cm-radius);
  box-shadow:0 10px 24px rgba(180,83,9,.25); padding:12px 10px;
}
#colorir-app .cm-palette-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:#7c2d12; text-align:center; }
/* título + cores + cor ativa andam juntos e centralizados na barra */
#colorir-app .cm-palette-main {
  flex:1 1 auto; min-height:0; width:100%;
  display:flex; flex-direction:column; justify-content:center; align-items:center; gap:8px;
}
#colorir-app .cm-colors {
  display:grid; grid-template-columns:repeat(2,1fr); grid-auto-rows:minmax(0,1fr);
  gap:7px 8px; width:100%; place-items:center;
  flex:0 1 auto; min-height:0; overflow:visible;
  padding:8px 12px;   /* respiro p/ o anel de seleção não cortar */
}
/* a bolinha se dimensiona pela altura da linha: enche a largura da coluna
   quando há espaço e encolhe sozinha em telas baixas, sem criar rolagem */
#colorir-app .cm-swatch {
  height:100%; width:100%; aspect-ratio:1/1; max-height:42px; max-width:42px; min-height:0;
  justify-self:center; align-self:center;
  border-radius:50%; border:3px solid #fff;
  box-shadow:0 3px 6px rgba(0,0,0,.25);
  transition:transform .15s ease, box-shadow .15s ease;
}
#colorir-app .cm-swatch:hover { transform:scale(1.07); }
#colorir-app .cm-swatch.is-on { transform:scale(1.07); box-shadow:0 0 0 3px #fff, 0 0 0 6px #1d4ed8, 0 4px 8px rgba(0,0,0,.28); }
#colorir-app .cm-current { display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.6);
  border-radius:16px; padding:6px 12px; }
#colorir-app .cm-current-emoji { font-size:22px; line-height:1; }
#colorir-app .cm-current-chip { width:40px; height:26px; border-radius:9px; border:3px solid #fff; box-shadow:inset 0 2px 5px rgba(0,0,0,.25); }
#colorir-app .cm-clear {
  width:100%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:8px;
  background:#0f172a; color:#fff; border:3px solid #334155; border-radius:18px; padding:10px 8px;
}
#colorir-app .cm-clear svg { width:26px; height:26px; }
#colorir-app .cm-clear span { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }

/* ---------- galeria inferior ---------- */
#colorir-app .cm-gallery {
  flex:0 0 auto;
  background:rgba(255,255,255,.92); border:4px solid #fde68a; border-radius:var(--cm-radius);
  box-shadow:0 8px 20px rgba(180,83,9,.15); padding:10px 12px 12px;
}
#colorir-app .cm-gallery-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
#colorir-app .cm-gallery-head .cm-crumb { font-size:15px; font-weight:700; color:#334155; display:flex; align-items:center; gap:6px; }
#colorir-app .cm-gallery-head .cm-crumb .cm-crumb-emoji { font-size:22px; }
#colorir-app .cm-rail { position:relative; display:flex; align-items:center; gap:6px; }
#colorir-app .cm-arrow { flex:0 0 auto; width:40px; height:76px; border-radius:16px; background:#fde68a; color:#92400e;
  display:grid; place-items:center; }
#colorir-app .cm-arrow svg { width:26px; height:26px; }
#colorir-app .cm-arrow[hidden] { display:none; }
#colorir-app .cm-cards {
  flex:1 1 auto; display:flex; gap:10px; overflow-x:auto; overflow-y:hidden; padding:6px 2px 10px;
  scroll-behavior:smooth; scrollbar-width:thin;
}
#colorir-app .cm-cards::-webkit-scrollbar { height:8px; }
#colorir-app .cm-cards::-webkit-scrollbar-thumb { background:#fcd34d; border-radius:99px; }
#colorir-app .cm-card {
  flex:0 0 auto; width:114px; padding:6px; border-radius:20px; background:#fff; border:3px solid #e2e8f0;
  display:flex; flex-direction:column; align-items:center; gap:4px;
}
#colorir-app .cm-card .cm-thumb {
  width:100%; height:66px; border-radius:14px; background:#fffbeb;
  display:grid; place-items:center; overflow:hidden;
}
#colorir-app .cm-card .cm-thumb svg { width:100%; height:100%; color:var(--cm-ink); }
#colorir-app .cm-card .cm-label { font-size:11.5px; font-weight:600; color:#475569; max-width:100%;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#colorir-app .cm-card.is-on { border-color:var(--cm-yellow-3); background:#fffbeb;
  box-shadow:0 2px 0 rgba(0,0,0,.22), 0 0 0 4px rgba(250,204,21,.45); }
#colorir-app .cm-card.cm-cat .cm-thumb { background:linear-gradient(180deg,#e0f2fe,#ede9fe); font-size:40px; }
#colorir-app .cm-card.cm-back { border-color:#fbbf24; background:#fef3c7; }
#colorir-app .cm-card.cm-back .cm-thumb { background:#fde68a; color:#92400e; }
#colorir-app .cm-card.cm-back .cm-thumb svg { width:44px; height:44px; }
#colorir-app .cm-card.cm-blank .cm-thumb { background:#fff; border:2px dashed #fcd34d; color:#f59e0b; }
#colorir-app .cm-card.cm-blank .cm-thumb svg { width:34px; height:34px; }

/* ---------- modal ---------- */
#colorir-app .cm-modal {
  position:fixed; inset:0; z-index:60; display:grid; place-items:center; padding:18px;
  background:rgba(0,0,0,.45); backdrop-filter:blur(3px);
}
#colorir-app .cm-modal[hidden] { display:none; }
#colorir-app .cm-modal-box {
  background:#fff; border:4px solid #fcd34d; border-radius:28px; padding:22px 20px;
  width:min(360px,100%); text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px;
  box-shadow:0 24px 60px rgba(0,0,0,.35);
}
#colorir-app .cm-modal-box .cm-modal-emoji { font-size:52px; animation:cm-pulse 1.4s ease-in-out infinite; }
@keyframes cm-pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
#colorir-app .cm-modal-box h3 { font-size:20px; font-weight:700; }
#colorir-app .cm-modal-box p { font-size:13.5px; color:#64748b; font-weight:500; }
#colorir-app .cm-modal-actions { display:flex; gap:10px; width:100%; margin-top:6px; }
#colorir-app .cm-modal-actions button { flex:1; padding:12px 8px; border-radius:18px; font-weight:700; font-size:14px;
  display:flex; align-items:center; justify-content:center; gap:6px; }
#colorir-app .cm-no { background:#e2e8f0; color:#475569; }
#colorir-app .cm-yes { background:#f43f5e; color:#fff; }

/* ---------- confete ao salvar ---------- */
#colorir-app .cm-confetti { position:fixed; inset:0; pointer-events:none; z-index:70; overflow:hidden; }
#colorir-app .cm-confetti i { position:absolute; width:12px; height:16px; border-radius:3px; animation:cm-fall 1.5s linear forwards; }
@keyframes cm-fall { to { transform:translateY(110vh) rotate(720deg); opacity:0; } }

/* ---------- responsivo ---------- */
@media (max-width:600px) {
  #colorir-app .cm-brand h1, #colorir-app .cm-brand div { display:none; }
  #colorir-app .cm-brand { padding-inline:0; }
}
@media (max-width:860px) {
  #colorir-app { padding:10px; gap:8px; }
  #colorir-app .cm-brand p { display:none; }
  #colorir-app .cm-brand h1 { font-size:18px; }
  #colorir-app .cm-work { flex-direction:column; }
  /* no celular a barra lateral some: as cores vão para a modal e o
     limpar sobe para a barra vermelha, sobrando tela para desenhar */
  #colorir-app .cm-palette { display:none; }
  #colorir-app .cm-color-btn { display:grid; }
  #colorir-app .cm-brand h1 { font-size:17px; }
  #colorir-app .cm-card { width:96px; }
  #colorir-app .cm-tool, #colorir-app .cm-action { width:52px; height:52px; border-radius:17px; }
  #colorir-app .cm-tool svg, #colorir-app .cm-action svg { width:29px; height:29px; }
  #colorir-app .cm-size { width:42px; height:42px; }
}
</style>

<div id="colorir-app">

  <!-- ================= BARRA SUPERIOR ================= -->
  <header class="cm-topbar">
    <div class="cm-brand">
      <span class="cm-brand-emoji">🎨</span>
      <div>
        <h1>Colorir Mágico</h1>
        <p>Pinte com alegria e imaginação!</p>
      </div>
    </div>

    <div class="cm-group">
      <!-- ferramentas -->
      <button class="cm-toy cm-tool is-on" data-tool="brush" title="Pincel — desenhar" aria-label="Pincel">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34a.996.996 0 0 0-1.41 0L9 12.25 11.75 15l8.96-8.96a.996.996 0 0 0 0-1.41z"/></svg>
      </button>
      <button class="cm-toy cm-tool" data-tool="bucket" title="Balde — pintar a área inteira" aria-label="Balde de tinta">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 17c1.1 0 2-.9 2-2s-2-4-2-4-2 2.9-2 4 1 2 2 2m-2.58-6.12l-6.3-6.3a2 2 0 0 0-2.83 0L3.71 8.16a2 2 0 0 0 0 2.83l6.3 6.3c.78.78 2.05.78 2.83 0l3.58-3.58a.996.996 0 0 0 0-1.41l-.4-.4 1.4-1.4 1.41 1.41 1.41-1.41-3.83-3.83M5.12 9.57l3.58-3.58 6.3 6.3-3.58 3.58-6.3-6.3z"/></svg>
      </button>
      <button class="cm-toy cm-tool" data-tool="eraser" title="Borracha — apagar" aria-label="Borracha">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.24 3.56l4.95 4.94c.78.79.78 2.05 0 2.84L12 20.53a4.008 4.008 0 0 1-5.66 0L2.81 17c-.78-.79-.78-2.05 0-2.84l10.6-10.6c.79-.78 2.05-.78 2.83 0M4.22 15.58l3.54 3.53c.78.79 2.04.79 2.83 0l3.53-3.53-4.95-4.95-4.95 4.95z"/></svg>
      </button>

      <!-- cor ativa: no celular abre a modal de cores (a barra lateral fica escondida) -->
      <button class="cm-toy cm-color-btn" id="cm-color-btn" title="Escolher a cor" aria-label="Escolher a cor">
        <span class="cm-color-btn-chip" id="cm-color-btn-chip"></span>
      </button>

      <!-- espessuras -->
      <div class="cm-pod" role="group" aria-label="Tamanho do pincel">
        <button class="cm-toy cm-size" data-size="2" title="Traço fino"><i style="width:8px;height:8px"></i></button>
        <button class="cm-toy cm-size is-on" data-size="4.4" title="Traço médio"><i style="width:15px;height:15px"></i></button>
        <button class="cm-toy cm-size" data-size="9.2" title="Traço grosso"><i style="width:24px;height:24px"></i></button>
      </div>
    </div>

    <div class="cm-group">
      <button class="cm-toy cm-action" id="cm-undo" title="Desfazer" aria-label="Desfazer" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
      </button>
      <button class="cm-toy cm-action cm-print" id="cm-print" title="Imprimir meu desenho" aria-label="Imprimir desenho">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
      </button>
      <button class="cm-toy cm-action cm-save" id="cm-save" title="Salvar meu desenho" aria-label="Salvar desenho">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
      </button>
    </div>
  </header>

  <!-- ================= ÁREA DE TRABALHO ================= -->
  <main class="cm-work">
    <section class="cm-stage" id="cm-stage">
      <div class="cm-paper" id="cm-paper">
        <canvas class="cm-paint" id="cm-paint" width="1000" height="700"></canvas>
        <canvas class="cm-lines" id="cm-lines" width="1000" height="700"></canvas>
      </div>
      <div class="cm-ghost" id="cm-ghost"></div>
    </section>

    <aside class="cm-palette">
      <div class="cm-palette-main">
        <div class="cm-palette-title">Cores Lindas</div>
        <div class="cm-colors" id="cm-colors"></div>
        <div class="cm-current">
          <span class="cm-current-chip" id="cm-current-chip" style="background:#ef4444"></span>
          <span class="cm-current-emoji" id="cm-current-emoji">🖌️</span>
        </div>

   de 200 x 140 unidades. A mesma lista serve para 2 coisas:

   Formas: ['c',cx,cy,r] círculo | ['C',...] círculo preenchido (olhos)
           ['e',cx,cy,rx,ry,rot?] elipse | ['E',...] elipse preenchida
           ['p','<path d>'] traço | ['P','<path d>'] preenchido
           ['l',x1,y1,x2,y2] linha reta
   ========================================================================== */

// --- geradores auxiliares -------------------------------------------------
function cmStar(cx, cy, R, r, n) {
  n = n || 5;
  var d = '', rot = -Math.PI / 2, step = Math.PI / n;
  for (var i = 0; i < n; i++) {
    d += (i ? 'L' : 'M') + (cx + Math.cos(rot) * R).toFixed(1) + ' ' + (cy + Math.sin(rot) * R).toFixed(1);
    rot += step;
    d += 'L' + (cx + Math.cos(rot) * r).toFixed(1) + ' ' + (cy + Math.sin(rot) * r).toFixed(1);
    rot += step;
  }
  return ['p', d + 'Z'];
}
function cmCloud(cx, cy, r) {
  return ['p', 'M' + (cx - 1.7 * r) + ' ' + cy +
    ' A' + (r * .8) + ' ' + (r * .8) + ' 0 0 1 ' + (cx - .7 * r) + ' ' + (cy - .8 * r) +
    ' A' + r + ' ' + r + ' 0 0 1 ' + (cx + .8 * r) + ' ' + (cy - .7 * r) +
    ' A' + (r * .75) + ' ' + (r * .75) + ' 0 0 1 ' + (cx + 1.7 * r) + ' ' + cy + ' Z'];
}
function cmFluff(cx, cy, rx, ry, n, amp) {
  var d = '', step = Math.PI * 2 / n, f = function (v) { return v.toFixed(1); };
  for (var i = 0; i < n; i++) {
    var a0 = i * step, a1 = a0 + step, am = a0 + step / 2;
    var x0 = cx + Math.cos(a0) * rx, y0 = cy + Math.sin(a0) * ry;
    var x1 = cx + Math.cos(a1) * rx, y1 = cy + Math.sin(a1) * ry;
    var xm = cx + Math.cos(am) * (rx + amp), ym = cy + Math.sin(am) * (ry + amp);
    if (i === 0) d += 'M' + f(x0) + ' ' + f(y0);
    d += 'Q' + f(xm) + ' ' + f(ym) + ' ' + f(x1) + ' ' + f(y1);
  }
  return ['p', d + 'Z'];
}
function cmBand(cx, cy, r1, r2) {
  return ['p', 'M' + (cx - r1) + ' ' + cy + ' A' + r1 + ' ' + r1 + ' 0 0 1 ' + (cx + r1) + ' ' + cy +
    ' L' + (cx + r2) + ' ' + cy + ' A' + r2 + ' ' + r2 + ' 0 0 0 ' + (cx - r2) + ' ' + cy + ' Z'];
}
function cmRays(cx, cy, r1, r2, n) {
  var out = [], half = (Math.PI / n) * 0.55;
  for (var i = 0; i < n; i++) {
    var a = (i / n) * Math.PI * 2;
    out.push(['p',
      'M' + (cx + Math.cos(a - half) * r1).toFixed(1) + ' ' + (cy + Math.sin(a - half) * r1).toFixed(1) +
      'L' + (cx + Math.cos(a) * r2).toFixed(1) + ' ' + (cy + Math.sin(a) * r2).toFixed(1) +
      'L' + (cx + Math.cos(a + half) * r1).toFixed(1) + ' ' + (cy + Math.sin(a + half) * r1).toFixed(1) + 'Z']);
  }
  return out;
}

/* ==========================================================================
   MOTOR DO APP
   Duas camadas de canvas empilhadas:
     • cm-paint  (embaixo) -> tudo que a criança pinta
     • cm-lines  (em cima) -> o contorno preto do desenho escolhido
   Assim a tinta nunca cobre o contorno, a borracha nunca apaga o desenho
   e o balde usa o contorno como "parede" (pinta só a parte clicada).
   ========================================================================== */

var app     = document.getElementById('colorir-app');
var stage   = document.getElementById('cm-stage');
var paper   = document.getElementById('cm-paper');
var paintCv = document.getElementById('cm-paint');
var lineCv  = document.getElementById('cm-lines');
var ghost   = document.getElementById('cm-ghost');
var pctx = paintCv.getContext('2d', { willReadFrequently: true });
var lctx = lineCv.getContext('2d', { willReadFrequently: true });

/* O buffer do canvas acompanha o tamanho real do container: dá pra desenhar
   em toda a área branca. O desenho pronto (prancheta 200x140) entra
   centralizado dentro dela, sem esticar. */
var W = paintCv.width, H = paintCv.height;
var SCALE = 1, OX = 0, OY = 0;

var COLORS = [
  ['#ef4444','Vermelho'],   ['#f97316','Laranja'],     ['#facc15','Amarelo'],
  ['#a3e635','Verde limão'],['#22c55e','Verde'],       ['#0f766e','Verde escuro'],
  ['#06b6d4','Azul piscina'],['#3b82f6','Azul'],       ['#1e3a8a','Azul escuro'],
  ['#a78bfa','Lilás'],      ['#8b5cf6','Roxo'],        ['#ec4899','Rosa'],
  ['#f9a8d4','Rosa claro'], ['#f5c396','Pele'],        ['#8b5a2b','Marrom'],
  ['#94a3b8','Cinza'],      ['#ffffff','Branco'],      ['#0f172a','Preto']
];

var tool = 'brush', color = COLORS[0][0], size = 4.4;   // espessura em unidades da prancheta
var drawing = false, lastX = 0, lastY = 0;
var galleryCat = null;      // null = tela de categorias
var activeTpl = 'blank';    // id do desenho selecionado
var currentShapes = null;   // formas do desenho atual (para o "limpar")

/* ---------- formas -> canvas / svg ---------- */
function shapePath(s) {
  var t = s[0], p;
  if (t === 'p' || t === 'P') return new Path2D(s[1]);
  p = new Path2D();
  if (t === 'c' || t === 'C') p.arc(s[1], s[2], s[3], 0, Math.PI * 2);
  else if (t === 'e' || t === 'E') p.ellipse(s[1], s[2], s[3], s[4], (s[5] || 0) * Math.PI / 180, 0, Math.PI * 2);
  else if (t === 'l') { p.moveTo(s[1], s[2]); p.lineTo(s[3], s[4]); }
  return p;
}
function drawShapes(ctx, shapes) {
  ctx.save();
  ctx.translate(OX, OY);
  ctx.scale(SCALE, SCALE);
  ctx.lineWidth = 1.7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#1e293b'; ctx.fillStyle = '#1e293b';
  for (var i = 0; i < shapes.length; i++) {
    var s = shapes[i], t = s[0], p = shapePath(s);
    if (t === 'C' || t === 'E' || t === 'P') ctx.fill(p); else ctx.stroke(p);
  }
  ctx.restore();
}
function shapesToSvg(shapes, sw) {
  var out = '';
  for (var i = 0; i < shapes.length; i++) {
    var s = shapes[i], t = s[0];
    if (t === 'c') out += '<circle cx="'+s[1]+'" cy="'+s[2]+'" r="'+s[3]+'"/>';
    else if (t === 'C') out += '<circle cx="'+s[1]+'" cy="'+s[2]+'" r="'+s[3]+'" fill="currentColor" stroke="none"/>';
    else if (t === 'e') out += '<ellipse cx="'+s[1]+'" cy="'+s[2]+'" rx="'+s[3]+'" ry="'+s[4]+'"'+(s[5]?' transform="rotate('+s[5]+' '+s[1]+' '+s[2]+')"':'')+'/>';
    else if (t === 'E') out += '<ellipse cx="'+s[1]+'" cy="'+s[2]+'" rx="'+s[3]+'" ry="'+s[4]+'" fill="currentColor" stroke="none"/>';
    else if (t === 'p') out += '<path d="'+s[1]+'"/>';
    else if (t === 'P') out += '<path d="'+s[1]+'" fill="currentColor" stroke="none"/>';
    else if (t === 'l') out += '<line x1="'+s[1]+'" y1="'+s[2]+'" x2="'+s[3]+'" y2="'+s[4]+'"/>';
  }
  return '<svg viewBox="0 0 200 140" fill="none" stroke="currentColor" stroke-width="'+sw+
         '" stroke-linecap="round" stroke-linejoin="round">'+out+'</svg>';
}

/* ---------- máscara de contorno (paredes do balde) ---------- */
var wall = new Uint8Array(W * H);
function buildWall() {
  var d = lctx.getImageData(0, 0, W, H).data;
  for (var i = 0, n = W * H; i < n; i++) wall[i] = d[i * 4 + 3] > 190 ? 1 : 0;
}

/* ---------- histórico (desfazer) ---------- */
var hist = [], MAX_HIST = 10;
var btnUndo = document.getElementById('cm-undo');
function snapshot() {
  if (hist.length >= MAX_HIST) hist.shift();
  var c = document.createElement('canvas');
  c.width = W; c.height = H;
  c.getContext('2d').drawImage(paintCv, 0, 0);
  hist.push(c);
  btnUndo.disabled = false;
}
function undo() {
  if (!hist.length) return;
  var c = hist.pop();
  pctx.setTransform(1, 0, 0, 1, 0, 0);
  pctx.globalCompositeOperation = 'source-over';
  pctx.clearRect(0, 0, W, H);
  pctx.drawImage(c, 0, 0);
  btnUndo.disabled = hist.length === 0;
}
function resetHistory() { hist.length = 0; btnUndo.disabled = true; }

/* ---------- carregar desenho ---------- */
function computeGeometry() {
  SCALE = Math.min(W / 200, H / 140);
  OX = (W - 200 * SCALE) / 2;
  OY = (H - 140 * SCALE) / 2;
}
function redrawLines() {
  lctx.setTransform(1, 0, 0, 1, 0, 0);
  lctx.clearRect(0, 0, W, H);
  if (currentShapes) drawShapes(lctx, currentShapes);
  buildWall();
}
function loadTemplate(shapes) {
  currentShapes = shapes || null;
  pctx.setTransform(1, 0, 0, 1, 0, 0);
  pctx.globalCompositeOperation = 'source-over';
  pctx.clearRect(0, 0, W, H);
  redrawLines();
  resetHistory();
}

/* ---------- coordenadas ---------- */
function pos(e) {
  var r = paintCv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}

/* ---------- pincel / borracha ---------- */
function brushPx() { return Math.max(2, size * SCALE); }
function beginStroke(p) {
  var w = brushPx();
  pctx.globalCompositeOperation = (tool === 'eraser') ? 'destination-out' : 'source-over';
  pctx.fillStyle = color; pctx.strokeStyle = color;
  pctx.lineWidth = w; pctx.lineCap = 'round'; pctx.lineJoin = 'round';
  pctx.beginPath(); pctx.arc(p.x, p.y, w / 2, 0, Math.PI * 2); pctx.fill();
}
function continueStroke(p) {
  pctx.beginPath(); pctx.moveTo(lastX, lastY); pctx.lineTo(p.x, p.y); pctx.stroke();
  lastX = p.x; lastY = p.y;
}

/* ---------- balde de tinta (flood fill limitado pelo contorno) ---------- */
function hexRgb(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function bucketFill(sx, sy, hex) {
  if (sx < 0 || sy < 0 || sx >= W || sy >= H) return;
  if (wall[sy * W + sx]) return;                     // clicou em cima do contorno
  var img = pctx.getImageData(0, 0, W, H), d = img.data;
  var rgb = hexRgb(hex), fr = rgb[0], fg = rgb[1], fb = rgb[2];
  var i0 = (sy * W + sx) * 4;
  var tr = d[i0], tg = d[i0+1], tb = d[i0+2], ta = d[i0+3];
  if (ta > 240 && Math.abs(tr-fr) < 10 && Math.abs(tg-fg) < 10 && Math.abs(tb-fb) < 10) return;

  var empty = ta < 24;
  function ok(i) {
    if (wall[i >> 2]) return false;
    var a = d[i+3];
    if (a === 255 && d[i] === fr && d[i+1] === fg && d[i+2] === fb) return false;
    if (empty) return a < 24;
    return a > 24 && Math.abs(d[i]-tr) < 28 && Math.abs(d[i+1]-tg) < 28 && Math.abs(d[i+2]-tb) < 28;
  }

  var stack = [sx, sy];
  while (stack.length) {
    var y = stack.pop(), x = stack.pop();
    var i = (y * W + x) * 4;
    while (x >= 0 && ok(i)) { x--; i -= 4; }
    x++; i += 4;
    var up = false, dn = false;
    while (x < W && ok(i)) {
      d[i] = fr; d[i+1] = fg; d[i+2] = fb; d[i+3] = 255;
      if (y > 0) {
        if (ok(i - W*4)) { if (!up) { stack.push(x, y-1); up = true; } } else up = false;
      }
      if (y < H-1) {
        if (ok(i + W*4)) { if (!dn) { stack.push(x, y+1); dn = true; } } else dn = false;
      }
      x++; i += 4;
    }
  }
  pctx.putImageData(img, 0, 0);
}

/* ---------- eventos de desenho ---------- */
function onDown(e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  var p = pos(e);
  snapshot();
  if (tool === 'bucket') { bucketFill(Math.round(p.x), Math.round(p.y), color); return; }
  drawing = true; lastX = p.x; lastY = p.y;
  try { paper.setPointerCapture(e.pointerId); } catch (err) {}
  beginStroke(p);
}
function onMove(e) {
  moveGhost(e);
  if (!drawing) return;
  e.preventDefault();
  continueStroke(pos(e));
}
function onUp() {
  if (!drawing) return;
  drawing = false;
  pctx.globalCompositeOperation = 'source-over';
}
paper.addEventListener('pointerdown', onDown);
paper.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
paper.addEventListener('pointerleave', function () { ghost.style.opacity = 0; });
paper.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ---------- bolinha-fantasma do tamanho do pincel ---------- */
function moveGhost(e) {
  if (tool === 'bucket') { ghost.style.opacity = 0; return; }
  var rs = stage.getBoundingClientRect(), rp = paper.getBoundingClientRect();
  var d = brushPx() * (rp.width / W);
  ghost.style.width = d + 'px'; ghost.style.height = d + 'px';
  ghost.style.left = (e.clientX - rs.left) + 'px';
  ghost.style.top = (e.clientY - rs.top) + 'px';
  ghost.style.background = (tool === 'eraser') ? 'rgba(255,255,255,.75)' : color + '55';
  ghost.style.opacity = 1;
}

/* ---------- cursores desenhados (mostram a ferramenta e a cor) ---------- */
function cursorUrl(svg, hx, hy) {
  return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '") ' + hx + ' ' + hy + ', crosshair';
}
function applyCursor() {
  var c = (tool === 'eraser') ? '#fca5a5' : color, svg, hx, hy;
  var head = "<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'>";
  if (tool === 'brush') {
    svg = head +
      "<path d='M4 28 L7 19 L22 4 L28 10 L13 25 Z' fill='#fff' stroke='#1e293b' stroke-width='2' stroke-linejoin='round'/>" +
      "<path d='M4 28 L7 19 L13 25 Z' fill='" + c + "' stroke='#1e293b' stroke-width='2' stroke-linejoin='round'/></svg>";
    hx = 4; hy = 28;
  } else if (tool === 'bucket') {
    svg = head +
      "<path d='M15 3 L29 15 L19 27 L5 15 Z' fill='#fff' stroke='#1e293b' stroke-width='2' stroke-linejoin='round'/>" +
      "<path d='M6 16 L3 29 L12 24 Z' fill='" + c + "' stroke='#1e293b' stroke-width='2' stroke-linejoin='round'/></svg>";
    hx = 3; hy = 29;
  } else {
    svg = head +
      "<path d='M12 28 L3 19 L19 3 L28 12 L20 28 Z' fill='#fff' stroke='#1e293b' stroke-width='2' stroke-linejoin='round'/>" +
      "<path d='M12 28 L3 19 L10 12 L19 21 Z' fill='#fca5a5' stroke='#1e293b' stroke-width='2' stroke-linejoin='round'/></svg>";
    hx = 4; hy = 28;
  }
  paper.style.cursor = cursorUrl(svg, hx, hy);
}

/* ---------- ferramentas / tamanhos / cores ---------- */
var TOOL_EMOJI = { brush: '🖌️', bucket: '🪣', eraser: '🧽' };
var toolBtns = app.querySelectorAll('.cm-tool');
var sizeBtns = app.querySelectorAll('.cm-size');
var chip = document.getElementById('cm-current-chip');
var toolEmoji = document.getElementById('cm-current-emoji');

function setTool(t) {
  tool = t;
  for (var i = 0; i < toolBtns.length; i++)
    toolBtns[i].classList.toggle('is-on', toolBtns[i].getAttribute('data-tool') === t);
  toolEmoji.textContent = TOOL_EMOJI[t];
  applyCursor();
}
function setSize(v, btn) {
  size = v;
  for (var i = 0; i < sizeBtns.length; i++) sizeBtns[i].classList.toggle('is-on', sizeBtns[i] === btn);
}
for (var i = 0; i < toolBtns.length; i++)
  toolBtns[i].addEventListener('click', function () { setTool(this.getAttribute('data-tool')); });
for (var j = 0; j < sizeBtns.length; j++)
  sizeBtns[j].addEventListener('click', function () { setSize(+this.getAttribute('data-size'), this); });

var colorsBox  = document.getElementById('cm-colors');      // barra lateral (desktop)
var colorGrid  = document.getElementById('cm-color-grid');  // modal (celular)
var colorBtn   = document.getElementById('cm-color-btn');
var colorChip  = document.getElementById('cm-color-btn-chip');
var colorModal = document.getElementById('cm-color-modal');
var swatches = [];

function setColor(hex, fromEl) {
  color = hex;
  for (var k = 0; k < swatches.length; k++)
    swatches[k].classList.toggle('is-on', swatches[k].getAttribute('data-color') === hex);
  chip.style.background = hex;
  colorChip.style.background = hex;
  colorChip.style.borderColor = (hex === '#ffffff') ? '#cbd5e1' : '#fff';
  if (tool === 'eraser') setTool('brush');   // criança escolheu cor: volta pro pincel
  else applyCursor();
  if (fromEl) pop(fromEl);
}
function buildSwatches(box, closeAfter) {
  COLORS.forEach(function (c) {
    var b = document.createElement('button');
    b.className = 'cm-swatch';
    b.style.background = c[0];
    b.title = c[1];
    b.setAttribute('data-color', c[0]);
    b.setAttribute('aria-label', c[1]);
    if (c[0] === '#ffffff') b.style.borderColor = '#cbd5e1';
    b.addEventListener('click', function () {
      setColor(c[0], b);
      if (closeAfter) setTimeout(function () { colorModal.hidden = true; }, 130);
    });
    swatches.push(b);
    box.appendChild(b);
  });
}
buildSwatches(colorsBox, false);
buildSwatches(colorGrid, true);

colorBtn.addEventListener('click', function () { colorModal.hidden = false; });
document.getElementById('cm-color-close').addEventListener('click', function () { colorModal.hidden = true; });
colorModal.addEventListener('click', function (e) { if (e.target === colorModal) colorModal.hidden = true; });

/* ---------- galeria (categorias -> desenhos) ---------- */
var cardsBox = document.getElementById('cm-cards');
var crumbText = document.getElementById('cm-crumb-text');
var crumbEmoji = document.querySelector('#cm-crumb .cm-crumb-emoji');
var btnPrev = document.getElementById('cm-prev');
var btnNext = document.getElementById('cm-next');

var ICON_BLANK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>';
var ICON_BACK  = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>';

function makeCard(cls, inner, label, onClick, on) {
  var b = document.createElement('button');
  b.className = 'cm-toy cm-card ' + cls + (on ? ' is-on' : '');
  b.innerHTML = '<span class="cm-thumb">' + inner + '</span><span class="cm-label">' + label + '</span>';
  b.title = label;
  b.addEventListener('click', onClick);
  cardsBox.appendChild(b);
  return b;
}
function renderGallery() {
  cardsBox.innerHTML = '';
  if (!galleryCat) {
    crumbEmoji.textContent = '✨';
    crumbText.textContent = 'Escolha uma imagem para colorir';
    makeCard('cm-blank', ICON_BLANK, 'Folha em branco', function () {
      activeTpl = 'blank'; loadTemplate(null); renderGallery();
    }, activeTpl === 'blank');
    CM_CATS.forEach(function (cat) {
      makeCard('cm-cat', '<span>' + cat.e + '</span>', cat.n, function () {
        galleryCat = cat; renderGallery(); cardsBox.scrollLeft = 0;
      }, false);
    });
  } else {
    crumbEmoji.textContent = galleryCat.e;
    crumbText.textContent = galleryCat.n;
    makeCard('cm-back', ICON_BACK, 'Voltar', function () {
      galleryCat = null; renderGallery(); cardsBox.scrollLeft = 0;
    }, false);
    galleryCat.items.forEach(function (item) {
      makeCard('', shapesToSvg(item.s, 4), item.n, function () {
        activeTpl = item.id; loadTemplate(item.s); renderGallery();
      }, activeTpl === item.id);
    });
  }
  setTimeout(updateArrows, 30);
}
function updateArrows() {
  var over = cardsBox.scrollWidth > cardsBox.clientWidth + 4;
  btnPrev.hidden = !over; btnNext.hidden = !over;
}
btnPrev.addEventListener('click', function () { cardsBox.scrollLeft -= cardsBox.clientWidth * .7; });
btnNext.addEventListener('click', function () { cardsBox.scrollLeft += cardsBox.clientWidth * .7; });
cardsBox.addEventListener('wheel', function (e) {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { cardsBox.scrollLeft += e.deltaY; e.preventDefault(); }
}, { passive: false });

/* ---------- juntar as duas camadas numa imagem só ---------- */
function compose() {
  var c = document.createElement('canvas');
  c.width = W; c.height = H;
  var x = c.getContext('2d');
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, H);
  x.drawImage(paintCv, 0, 0);
  x.drawImage(lineCv, 0, 0);
  return c;
}
function stamp() {
  var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}

/* baixar em PNG (melhor formato p/ desenho de contorno: sem borrar, fundo limpo) */
document.getElementById('cm-save').addEventListener('click', function () {
  var a = document.createElement('a');
  a.download = 'colorir-magico-' + stamp() + '.png';
  a.href = compose().toDataURL('image/png');
  document.body.appendChild(a); a.click(); a.remove();
  confetti();
});

/* imprimir só o desenho, via iframe escondido (não depende de pop-up) */
document.getElementById('cm-print').addEventListener('click', function () {
  var url = compose().toDataURL('image/png');
  var old = document.getElementById('cm-print-frame');
  if (old) old.remove();
  var f = document.createElement('iframe');
  f.id = 'cm-print-frame';
  f.setAttribute('aria-hidden', 'true');
  f.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;border:0;opacity:0;';
  document.body.appendChild(f);
  var d = f.contentWindow.document;
  d.open();
  d.write('<!DOCTYPE html><html><head><title>Meu desenho</title><style>' +
    '@page{size:landscape;margin:8mm}' +
    'html,body{margin:0;padding:0;height:100%;background:#fff}' +
    'img{width:100%;height:100%;object-fit:contain}' +
    '</style></head><body><img src="' + url + '"></body></html>');
  d.close();
  var go = function () {
    try { f.contentWindow.focus(); f.contentWindow.print(); } catch (err) {}
    setTimeout(function () { f.remove(); }, 4000);
  };
  var img = d.images[0];
  if (img && !img.complete) img.onload = function () { setTimeout(go, 60); };
  else setTimeout(go, 120);
});

/* ---------- desfazer / limpar ---------- */
btnUndo.addEventListener('click', undo);
var modal = document.getElementById('cm-modal');
document.getElementById('cm-clear').addEventListener('click', function () { modal.hidden = false; });
document.getElementById('cm-clear-mobile').addEventListener('click', function () {
  colorModal.hidden = true; modal.hidden = false;
});
document.getElementById('cm-modal-no').addEventListener('click', function () { modal.hidden = true; });
document.getElementById('cm-modal-yes').addEventListener('click', function () {
  modal.hidden = true;
  pctx.clearRect(0, 0, W, H);      // some a tinta, o contorno continua lá
  resetHistory();
});
modal.addEventListener('click', function (e) { if (e.target === modal) modal.hidden = true; });
document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  if (e.key === 'Escape') { modal.hidden = true; colorModal.hidden = true; }
});

/* ---------- confetes ao salvar ---------- */
function confetti() {
  var box = document.createElement('div');
  box.className = 'cm-confetti';
  for (var i = 0; i < 26; i++) {
    var p = document.createElement('i');
    p.style.left = (Math.random() * 100) + '%';
    p.style.top = '-20px';
    p.style.background = COLORS[(Math.random() * COLORS.length) | 0][0];
    p.style.animationDelay = (Math.random() * .35) + 's';
    p.style.animationDuration = (1.1 + Math.random()) + 's';
    box.appendChild(p);
  }
  app.appendChild(box);
  setTimeout(function () { box.remove(); }, 2400);
}
function pop(el) {
  if (!el.animate) return;
  el.animate(
    [{ transform: 'scale(1)' }, { transform: 'scale(1.18)' }, { transform: 'scale(1)' }],
    { duration: 220, easing: 'ease-out' }
  );
}

/* ---------- o canvas acompanha o tamanho do container ---------- */
var MAX_PIXELS = 2000000;   // teto de resolução (memória/velocidade do balde)
function relayout() {
  var r = paper.getBoundingClientRect();
  var cw = Math.round(r.width), ch = Math.round(r.height);
  if (cw < 40 || ch < 40) return;
  var dpr = window.devicePixelRatio || 1;
  if (dpr > 2) dpr = 2;
  if (cw * ch * dpr * dpr > MAX_PIXELS) dpr = Math.sqrt(MAX_PIXELS / (cw * ch));
  var nW = Math.round(cw * dpr), nH = Math.round(ch * dpr);
  if (nW === W && nH === H) return;

  var oldW = W, oldH = H, oldScale = SCALE, oldOX = OX, oldOY = OY;
  var keep = document.createElement('canvas');
  keep.width = oldW; keep.height = oldH;
  keep.getContext('2d').drawImage(paintCv, 0, 0);

  W = nW; H = nH;
  paintCv.width = W; paintCv.height = H;
  lineCv.width = W; lineCv.height = H;
  wall = new Uint8Array(W * H);
  computeGeometry();

  // a pintura acompanha o desenho na nova escala
  var k = SCALE / oldScale;
  pctx.setTransform(1, 0, 0, 1, 0, 0);
  pctx.globalCompositeOperation = 'source-over';
  pctx.clearRect(0, 0, W, H);
  pctx.drawImage(keep, 0, 0, oldW, oldH, OX - oldOX * k, OY - oldOY * k, oldW * k, oldH * k);

  redrawLines();
  resetHistory();
  updateArrows();
}
if (window.ResizeObserver) new ResizeObserver(relayout).observe(stage);
window.addEventListener('resize', relayout);
window.addEventListener('orientationchange', function () { setTimeout(relayout, 300); });

/* ---------- partiu! ---------- */
setTool('brush');
setColor(COLORS[0][0]);
renderGallery();
computeGeometry();
loadTemplate(null);
relayout();
})();
</script>
